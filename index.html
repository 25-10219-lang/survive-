<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>용사를 피해라!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050508;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #ui-bar {
      width: 1200px;
      max-width: 95vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: bold;
    }
    .status-group span { margin-right: 15px; }
    #canvas-container {
      position: relative;
      width: 1200px;
      height: 700px;
      max-width: 95vw;
      max-height: 80vh;
    }
    canvas {
      width: 100%;
      height: 100%;
      background-color: #0d0d12;
      border: 4px solid #374151;
      border-radius: 8px;
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }
    .hidden { display: none !important; }
    button {
      background-color: #dc2626;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover { background-color: #b91c1c; }
    .opt-btn {
      width: 100%;
      max-width: 320px;
      background-color: #1f2937;
      border: 1px solid #4b5563;
      padding: 10px;
      margin: 5px 0;
      text-align: left;
      font-size: 14px;
    }
    .opt-btn:hover { background-color: #374151; }
    #fever-banner {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #eab308;
      color: #000;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="ui-bar">
    <div class="status-group">
      <span style="color: #f87171;">❤️ 체력: <span id="hp-text">300/300</span></span>
      <span style="color: #facc15;">⭐ 레벨: <span id="level-text">1</span></span>
      <span style="color: #c084fc;">💀 처치: <span id="kill-text">0</span></span>
    </div>
    <div>⏱️ 생존 시간: <span id="time-text">00:00</span></div>
  </div>

  <div id="canvas-container">
    <canvas id="gameCanvas" width="1200" height="700"></canvas>

    <div id="fever-banner" class="hidden">⚡ [SPACEBAR] 필살기 준비 완료!</div>

    <!-- 시작 화면 -->
    <div id="start-screen" class="overlay">
      <h1 style="font-size: 36px; color: #ef4444; margin-bottom: 10px;">😈 용사를 피해라!</h1>
      <p style="color: #9ca3af; margin-bottom: 20px;">[대형 맵 + 필살기 완성 버전]</p>
      <div style="background: #111827; padding: 15px; border-radius: 6px; text-align: left; font-size: 14px; line-height: 1.6;">
        <p style="color: #facc15; font-weight: bold;">🎮 조작 방법:</p>
        <p>• 이동: W, A, S, D 또는 방향키</p>
        <p>• 충격파: 마우스 좌클릭</p>
        <p>• 필살기: 게이지 충전 후 [Spacebar]</p>
      </div>
      <button id="start-btn">🔥 게임 시작</button>
    </div>

    <!-- 레벨업 화면 -->
    <div id="level-modal" class="overlay hidden">
      <h2 style="color: #facc15; font-size: 28px; margin-bottom: 10px;">🎉 LEVEL UP!</h2>
      <p style="font-size: 14px; color: #d1d5db; margin-bottom: 15px;">강화할 능력을 선택하세요</p>
      <div id="option-list"></div>
    </div>

    <!-- 게임 오버 화면 -->
    <div id="gameover-modal" class="overlay hidden">
      <h2 style="color: #ef4444; font-size: 32px; margin-bottom: 10px;">💀 마왕 봉인됨</h2>
      <p style="margin-bottom: 5px;">버틴 시간: <span id="res-time" style="color: #facc15;">00:00</span></p>
      <p style="margin-bottom: 15px;">처치한 용사: <span id="res-kills" style="color: #f87171;">0</span>명</p>
      <button id="restart-btn">🔄 다시 도전</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let isPlaying = false;
    let keys = {};
    let gameTime = 0, gameTimer = null, kills = 0, shakeTime = 0;
    let ultimateGauge = 0;

    let player = {
      x: 600, y: 350, radius: 18, hp: 300, maxHp: 300, speed: 4.0,
      level: 1, exp: 0, maxExp: 6, shockwaveCd: 0
    };

    let weapons = {
      sickle: { level: 1, angle: 0 },
      fireball: { level: 0, timer: 0 },
      shield: { level: 0 },
      speed: { level: 0 }
    };

    let enemies = [], expOrbs = [], particles = [], fireballs = [], damageTexts = [];

    // 이벤트 리스너 등록
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space' && ultimateGauge >= 100 && isPlaying) useUltimate();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);
    
    canvas.addEventListener('mousedown', () => {
      if (isPlaying && player.shockwaveCd <= 0) triggerShockwave();
    });

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    function startGame() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('gameover-modal').classList.add('hidden');
      document.getElementById('level-modal').classList.add('hidden');
      
      player = { x: 600, y: 350, radius: 18, hp: 300, maxHp: 300, speed: 4.0, level: 1, exp: 0, maxExp: 6, shockwaveCd: 0 };
      weapons = { sickle: { level: 1, angle: 0 }, fireball: { level: 0, timer: 0 }, shield: { level: 0 }, speed: { level: 0 } };
      enemies = []; expOrbs = []; particles = []; fireballs = []; damageTexts = [];
      gameTime = 0; kills = 0; ultimateGauge = 0;
      
      updateUi();

      if (gameTimer) clearInterval(gameTimer);
      gameTimer = setInterval(() => {
        gameTime++;
        const m = String(Math.floor(gameTime / 60)).padStart(2, '0');
        const s = String(gameTime % 60).padStart(2, '0');
        document.getElementById('time-text').innerText = `${m}:${s}`;
      }, 1000);

      isPlaying = true;
      requestAnimationFrame(gameLoop);
    }

    function updateUi() {
      document.getElementById('hp-text').innerText = `${Math.ceil(player.hp)}/${player.maxHp}`;
      document.getElementById('level-text').innerText = player.level;
      document.getElementById('kill-text').innerText = kills;

      const banner = document.getElementById('fever-banner');
      if (ultimateGauge >= 100) banner.classList.remove('hidden');
      else banner.classList.add('hidden');
    }

    function addDmgText(x, y, text, color = '#facc15') {
      damageTexts.push({ x, y, text, color, life: 25, vy: -1.2 });
    }

    function useUltimate() {
      ultimateGauge = 0;
      shakeTime = 25;
      updateUi();
      addDmgText(600, 300, "⚡ 필살기 발동!!!", "#f59e0b");

      enemies.forEach(e => {
        e.hp -= 200;
        const a = Math.atan2(e.y - player.y, e.x - player.x);
        e.x += Math.cos(a) * 350;
        e.y += Math.sin(a) * 350;
      });
    }

    function triggerShockwave() {
      player.shockwaveCd = 120;
      shakeTime = 8;
      enemies.forEach(e => {
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d < 180) {
          e.hp -= 80;
          addDmgText(e.x, e.y, "80!", "#ef4444");
          e.x += (e.x - player.x)/d * 60;
          e.y += (e.y - player.y)/d * 60;
        }
      });
    }

    function spawnEnemy() {
      if (enemies.length > 60) return;
      let x, y;
      if (Math.random() < 0.5) { x = Math.random() < 0.5 ? -20 : 1220; y = Math.random() * 700; }
      else { x = Math.random() * 1200; y = Math.random() < 0.5 ? -20 : 720; }
      enemies.push({ x, y, radius: 12, hp: 6 + gameTime*0.05, speed: 1.0 + Math.random()*0.5 });
    }

    function gameLoop() {
      if (!isPlaying) return;

      ctx.save();
      if (shakeTime > 0) {
        shakeTime--;
        ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 플레이어 이동
      let dx = 0, dy = 0;
      if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
      if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

      const spd = player.speed + (weapons.speed.level * 0.4);
      player.x = Math.max(player.radius, Math.min(1200 - player.radius, player.x + dx * spd));
      player.y = Math.max(player.radius, Math.min(700 - player.radius, player.y + dy * spd));

      if (player.shockwaveCd > 0) player.shockwaveCd--;
      if (Math.random() < 0.05) spawnEnemy();

      // 무기 (낫)
      if (weapons.sickle.level > 0) {
        const count = 1 + Math.floor(weapons.sickle.level / 2);
        weapons.sickle.angle += 0.05;

        for (let i = 0; i < count; i++) {
          const a = weapons.sickle.angle + (Math.PI * 2 / count) * i;
          const sx = player.x + Math.cos(a) * 75;
          const sy = player.y + Math.sin(a) * 75;

          ctx.fillStyle = '#38bdf8';
          ctx.beginPath(); ctx.arc(sx, sy, 12, 0, Math.PI*2); ctx.fill();

          enemies.forEach(e => {
            if (Math.hypot(e.x - sx, e.y - sy) < e.radius + 12) {
              e.hp -= 2.5;
            }
          });
        }
      }

      // 적 이동 및 피격
      enemies.forEach((e, index) => {
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(a) * e.speed;
        e.y += Math.sin(a) * e.speed;

        ctx.fillStyle = '#22c55e';
        ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2); ctx.fill();

        if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
          player.hp -= 0.08;
          updateUi();
          if (player.hp <= 0) {
            isPlaying = false;
            clearInterval(gameTimer);
            document.getElementById('res-time').innerText = document.getElementById('time-text').innerText;
            document.getElementById('res-kills').innerText = kills;
            document.getElementById('gameover-modal').classList.remove('hidden');
          }
        }

        if (e.hp <= 0) {
          kills++;
          if (ultimateGauge < 100) ultimateGauge += 5;
          expOrbs.push({ x: e.x, y: e.y });
          enemies.splice(index, 1);
          updateUi();
        }
      });

      // 데미지 텍스트
      damageTexts.forEach((dt, index) => {
        dt.y += dt.vy; dt.life--;
        ctx.font = 'bold 16px sans-serif';
        ctx.fillStyle = dt.color;
        ctx.fillText(dt.text, dt.x - 10, dt.y);
        if (dt.life <= 0) damageTexts.splice(index, 1);
      });

      // 경험치 구슬
      expOrbs.forEach((orb, index) => {
        ctx.fillStyle = '#c084fc';
        ctx.beginPath(); ctx.arc(orb.x, orb.y, 5, 0, Math.PI*2); ctx.fill();

        if (Math.hypot(player.x - orb.x, player.y - orb.y) < player.radius + 20) {
          player.exp++;
          expOrbs.splice(index, 1);
          if (player.exp >= player.maxExp) {
            player.level++;
            player.exp = 0;
            player.maxExp = Math.floor(player.maxExp * 1.2);
            isPlaying = false;

            const modal = document.getElementById('level-modal');
            const list = document.getElementById('option-list');
            list.innerHTML = '';

            const opts = [
              { name: "🪓 마력 낫 강화", action: () => weapons.sickle.level++ },
              { name: "🛡️ 마왕의 보호막", action: () => weapons.shield.level++ },
              { name: "👟 신속의 장화", action: () => weapons.speed.level++ }
            ];

            opts.forEach(opt => {
              const btn = document.createElement('button');
              btn.className = 'opt-btn';
              btn.innerText = opt.name;
              btn.onclick = () => {
                opt.action();
                modal.classList.add('hidden');
                isPlaying = true;
                requestAnimationFrame(gameLoop);
              };
              list.appendChild(btn);
            });

            modal.classList.remove('hidden');
          }
        }
      });

      // 플레이어 그리기
      ctx.fillStyle = '#ef4444';
      ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(player.x - 5, player.y - 3, 3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(player.x + 5, player.y - 3, 3, 0, Math.PI*2); ctx.fill();

      ctx.restore();
      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
