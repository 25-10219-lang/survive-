<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>용사를 피해라! - 필살기 & 대형 맵</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DungGeunMo&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DungGeunMo', monospace; background-color: #050508; color: #fff; overflow: hidden; user-select: none; }
    .pixel-box { border: 4px solid #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
    .evo-box { border: 4px solid #f59e0b; box-shadow: 0 0 20px rgba(245, 158, 11, 0.8); background: linear-gradient(135deg, #451a03, #78350f); }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2">

  <!-- UI 상단 -->
  <div class="w-full max-w-6xl flex justify-between items-center mb-2 px-4 text-xs md:text-sm">
    <div class="flex gap-4 items-center">
      <span class="text-red-400 font-bold">❤️ 체력: <span id="hp-text">300/300</span></span>
      <span class="text-yellow-400 font-bold">⭐ 레벨: <span id="level-text">1</span></span>
      <span class="text-purple-400 font-bold">💀 처치: <span id="kill-text">0</span></span>
      <button id="bgm-btn" onclick="toggleBgm()" class="bg-gray-800 hover:bg-gray-700 px-2 py-1 rounded text-xs border border-gray-600">🔊 BGM: ON</button>
    </div>
    <div class="text-gray-300 font-bold">⏱️ 생존 시간: <span id="time-text">00:00</span></div>
  </div>

  <div class="relative">
    <!-- 1200x700 대형 캔버스 -->
    <canvas id="gameCanvas" width="1200" height="700" class="bg-gray-950 border-4 border-gray-800 rounded-lg shadow-2xl cursor-crosshair max-w-full h-auto"></canvas>

    <!-- 필살기 안내 팝업 -->
    <div id="fever-notice" class="hidden absolute bottom-6 left-1/2 -translate-x-1/2 bg-yellow-500 text-black font-bold px-6 py-2 rounded-full text-sm animate-bounce shadow-xl border-2 border-yellow-200">
      ⚡ [SPACEBAR] 필살기 사용 가능!
    </div>

    <!-- 시작 화면 -->
    <div id="start-screen" class="absolute inset-0 bg-black/85 flex flex-col items-center justify-center rounded-lg p-6 text-center">
      <h1 class="text-3xl md:text-5xl font-bold text-red-500 mb-3 animate-pulse">😈 용사를 피해라!</h1>
      <p class="text-sm text-gray-300 mb-6">"넓어진 전장에서 강력한 필살기로 용사들을 격퇴하세요!"</p>
      
      <div class="bg-gray-900 border border-gray-700 p-4 rounded text-left text-xs md:text-sm space-y-2 mb-6 max-w-md">
        <p class="text-yellow-400 font-bold">🎮 조작법:</p>
        <p>• 이동: <span class="text-white font-bold">W, A, S, D</span> / <span class="text-white font-bold">방향키</span></p>
        <p>• 마왕 충격파: <span class="text-white font-bold">마우스 좌클릭</span></p>
        <p>• <span class="text-yellow-300 font-bold">필살기</span>: 게이지 충전 후 <span class="text-white font-bold">Spacebar</span></p>
      </div>

      <button onclick="startGame()" class="bg-red-600 hover:bg-red-500 text-white font-bold px-8 py-3 rounded-lg text-base shadow-lg transition-all active:scale-95">
        🔥 마왕 부활 (게임 시작)
      </button>
    </div>

    <!-- 레벨업 모달 -->
    <div id="level-modal" class="hidden absolute inset-0 bg-black/80 flex flex-col items-center justify-center rounded-lg p-6">
      <h2 id="modal-title" class="text-2xl font-bold text-yellow-400 mb-1">🎉 LEVEL UP!</h2>
      <p id="modal-sub" class="text-xs text-gray-300 mb-4">스킬을 선택하세요!</p>
      <div id="option-container" class="space-y-3 w-full max-w-sm"></div>
    </div>

    <!-- 게임 오버 모달 -->
    <div id="gameover-modal" class="hidden absolute inset-0 bg-black/90 flex flex-col items-center justify-center rounded-lg p-6 text-center">
      <div id="card-to-capture" class="bg-gray-900 pixel-box p-6 rounded-lg max-w-xs w-full mb-4">
        <h2 class="text-2xl font-bold text-red-500 mb-1">💀 마왕 봉인됨</h2>
        <div class="space-y-2 text-sm text-left border-y border-gray-800 py-3 my-2">
          <p>⏱️ 버틴 시간: <span id="res-time" class="text-yellow-400 font-bold">00:00</span></p>
          <p>💀 처치한 용사: <span id="res-kills" class="text-red-400 font-bold">0</span>명</p>
          <p>⭐ 달성 레벨: <span id="res-level" class="text-purple-400 font-bold">LV.1</span></p>
        </div>
      </div>
      <div class="flex gap-2">
        <button onclick="downloadScoreCard()" class="bg-green-600 hover:bg-green-500 text-white font-bold px-4 py-2 rounded text-xs">📸 스코어 카드 저장</button>
        <button onclick="resetGame()" class="bg-red-600 hover:bg-red-500 text-white font-bold px-4 py-2 rounded text-xs">🔄 다시 도전</button>
      </div>
    </div>
  </div>

    const ctx = canvas.getContext('2d');

      const freq = notes[Math.floor(Math.random() * notes.length)];
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    }

      bgmEnabled = !bgmEnabled;
      document.getElementById('bgm-btn').innerText = bgmEnabled ? "🔊 BGM: ON" : "🔇 BGM: OFF";
    }
